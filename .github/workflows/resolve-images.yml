name: Resolve dish images

# Runs the image resolver on GitHub's runners (which have internet) to fetch,
# verify and self-host real dish photos, then commits the results back to the
# branch. Run it on demand from the Actions tab, or when the recipe data or the
# resolver script changes on this branch.
on:
  workflow_dispatch:
    inputs:
      download:
        description: 'Self-host photos into public/dishes (recommended)'
        type: boolean
        default: true
  push:
    branches: [claude/clever-mayer-8wihoo]
    paths:
      - 'scripts/resolve-images.mjs'
      - 'src/data/recipes-*.ts'

permissions:
  contents: write

concurrency:
  group: resolve-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve + download real dish photos
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.download }}" = "true" ]; then
            node scripts/resolve-images.mjs --download
          else
            node scripts/resolve-images.mjs
          fi

      - name: Verify the project still builds
        run: npm run build

      - name: Commit resolved images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/images.generated.ts public/dishes 2>/dev/null || git add src/data/images.generated.ts
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Resolve verified self-hosted dish photos [skip ci]"
            git push
          fi
